<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云端 AI 远程运维助手</title>
<style>
  :root {
    --bg: #1a1a2e; --surface: #16213e; --surface2: #0f3460;
    --accent: #e94560; --text: #eaeaea; --text2: #a0a0b0;
    --border: #2a2a4a; --success: #4ade80; --warn: #fbbf24;
    --error: #f87171; --info: #60a5fa;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; display: flex; justify-content: center; align-items: center;
  }

  #app {
    width: 100%; max-width: 1400px; height: 100vh;
    display: flex; flex-direction: column; background: var(--surface);
    border-left: 1px solid var(--border); border-right: 1px solid var(--border);
  }

  /* ====== Header ====== */
  #header {
    padding: 12px 20px; background: var(--surface2);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  }
  #header .title { font-size: 16px; font-weight: 600; }
  #status-dot {
    display: inline-block; width: 10px; height: 10px;
    border-radius: 50%; margin-right: 6px;
  }
  #status-dot.online { background: var(--success); box-shadow: 0 0 6px var(--success); }
  #status-dot.offline { background: var(--error); }
  #status-dot.connecting { background: var(--warn); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  #status-text { font-size: 13px; color: var(--text2); }

  #room-display {
    font-family: monospace; font-size: 14px; color: var(--info);
    background: var(--bg); padding: 4px 12px; border-radius: 6px; letter-spacing: 2px;
  }

  #lang-switcher {
    font-size: 12px; padding: 3px 6px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text2); cursor: pointer; outline: none;
  }
  #lang-switcher:hover, #lang-switcher:focus { border-color: var(--info); }

  /* Auto-approve toggle */
  #auto-approve-btn {
    font-size: 11px; padding: 3px 8px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text2); cursor: pointer;
    display: none;
  }
  #auto-approve-btn.enabled { background: rgba(251,191,36,0.15); color: var(--warn); border-color: var(--warn); }

  /* ====== Messages ====== */
  #messages {
    flex: 1; overflow-y: auto; padding: 20px 28px;
    display: flex; flex-direction: column; gap: 12px;
  }

  .msg {
    max-width: 78%; padding: 10px 14px; border-radius: 12px;
    line-height: 1.6; font-size: 14px; word-break: break-word;
    display: flex; align-items: flex-start; gap: 8px;
  }
  .msg .msg-body { min-width: 0; flex: 1; }
  .msg .msg-time { font-size: 11px; opacity: 0.65; flex-shrink: 0; margin-top: 3px; white-space: nowrap; }
  .msg.user { align-self: flex-end; background: var(--info); color: #fff; border-bottom-right-radius: 4px; }
  .msg.user .msg-time { order: 2; }
  .msg.ai {
    align-self: flex-start; background: var(--surface2);
    border: 1px solid var(--border); border-bottom-left-radius: 4px;
    max-width: 920px;
  }
  .msg.ai .msg-time { order: 0; }
  .msg.ai h1, .msg.ai h2, .msg.ai h3 { margin: 8px 0 4px; font-size: 15px; }
  .msg.ai ul, .msg.ai ol { padding-left: 20px; }
  .msg.ai code { background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  .msg.ai pre { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 12px; }
  .msg.ai strong { color: var(--warn); }

  .msg.system { align-self: center; font-size: 12px; color: var(--text2); background: transparent; padding: 4px 8px; display: block; }
  .msg.error {
    align-self: center; font-size: 13px;
    background: rgba(248,113,113,0.15); border: 1px solid rgba(248,113,113,0.3); color: var(--error);
    display: block;
  }

  /* Tool card */
  .msg.tool {
    align-self: flex-start; width: 100%; max-width: 100%;
    font-size: 13px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border);
  }
  .tool-header {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; cursor: pointer; user-select: none;
  }
  .tool-header .icon { font-size: 16px; }
  .tool-header .name { font-weight: 600; color: var(--info); }
  .tool-header .status { font-size: 12px; margin-left: auto; }
  .tool-body {
    padding: 8px 12px 12px; border-top: 1px solid var(--border);
    display: none; overflow-x: auto;
  }
  .tool-body.open { display: block; }
  .tool-body pre {
    font-size: 11px; max-height: 300px; overflow-y: auto; white-space: pre-wrap;
    background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px; margin: 0;
  }

  .tool-status.running { color: var(--warn); }
  .tool-status.done { color: var(--success); }
  .tool-status.error { color: var(--error); }
  .tool-status.denied { color: var(--error); }

  /* Tier badge */
  .tier-badge { padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; }
  .tier-badge.t2 { background: rgba(251,191,36,0.2); color: var(--warn); }
  .tier-badge.t3 { background: rgba(248,113,113,0.2); color: var(--error); }

  /* ====== Approval Dialog ====== */
  #approval-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: none; justify-content: center; align-items: center; z-index: 9999;
  }
  #approval-dialog {
    background: var(--surface); border: 2px solid var(--error); border-radius: 16px;
    padding: 24px; width: 420px; max-width: 95vw;
    box-shadow: 0 0 40px rgba(233,69,96,0.3);
  }
  #approval-dialog h3 { margin-bottom: 8px; color: var(--error); }
  #approval-dialog .tool-info {
    background: var(--bg); padding: 12px; border-radius: 8px; margin: 12px 0;
    font-size: 13px;
  }
  #approval-dialog .tool-info code {
    background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; font-size: 11px;
  }
  #approval-dialog .args-display {
    font-size: 11px; color: var(--text2); word-break: break-all; max-height: 100px; overflow-y: auto;
  }
  #approval-dialog .timer { font-size: 13px; color: var(--warn); margin: 8px 0; }
  #approval-dialog .btn-row { display: flex; gap: 10px; margin-top: 16px; }
  #approval-dialog button {
    flex: 1; padding: 14px; border: none; border-radius: 8px;
    font-size: 16px; font-weight: 700; cursor: pointer;
  }
  #approval-dialog .btn-deny { background: rgba(248,113,113,0.3); color: var(--error); border: 1px solid var(--error); }
  #approval-dialog .btn-deny:hover { background: rgba(248,113,113,0.5); }
  #approval-dialog .btn-approve { background: var(--success); color: #000; font-weight: 700; }
  #approval-dialog .btn-approve:hover { opacity: 0.85; }
  #approval-dialog .deny-reason {
    width: 100%; padding: 8px; margin-top: 8px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--bg); color: var(--text); font-size: 12px; outline: none;
    display: none;
  }

  /* ====== Input ====== */
  #input-area {
    padding: 14px 28px; border-top: 1px solid var(--border);
    display: flex; gap: 10px; flex-shrink: 0; background: var(--surface);
  }
  #input-box {
    flex: 1; padding: 10px 14px; border: 1px solid var(--border);
    border-radius: 24px; background: var(--bg); color: var(--text);
    font-size: 14px; outline: none; resize: none;
    min-height: 42px; max-height: 120px; font-family: inherit;
  }
  #input-box:focus { border-color: var(--info); }
  #send-btn {
    padding: 10px 24px; border: none; border-radius: 24px;
    background: var(--accent); color: #fff; font-size: 14px;
    font-weight: 600; cursor: pointer; transition: opacity 0.2s;
  }
  #send-btn:hover { opacity: 0.85; }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ====== Connect Dialog ====== */
  #connect-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: flex; justify-content: center; align-items: center; z-index: 100;
  }
  #connect-dialog {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 28px 32px; width: 560px; max-width: 94vw; text-align: center;
  }
  #connect-dialog h2 { margin-bottom: 8px; }
  #connect-dialog p { font-size: 13px; color: var(--text2); margin-bottom: 20px; }
  #connect-dialog input {
    width: 100%; padding: 12px; border: 1px solid var(--border);
    border-radius: 10px; background: var(--bg); color: var(--text);
    font-size: 16px; text-align: center; letter-spacing: 3px;
    font-family: monospace; outline: none; text-transform: uppercase;
  }
  #connect-dialog input:focus { border-color: var(--info); }
  #connect-dialog .action-row {
    display: flex; gap: 10px; margin-top: 16px;
  }
  #connect-dialog .action-row button {
    flex: 1; padding: 14px; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
  #join-btn { background: var(--accent); color: #fff; }
  #join-btn:hover { opacity: 0.85; }
  #create-room-link {
    background: var(--surface2); color: var(--info);
    border: 1px solid var(--info) !important; font-weight: 600;
  }
  #create-room-link:hover { background: rgba(96,165,250,0.15); }
  #connect-dialog .hint { margin-top: 12px; font-size: 12px; color: var(--text2); }
  #connect-dialog .hint a { color: var(--info); cursor: pointer; text-decoration: underline; }

  /* Close button for connect dialog */
  #connect-dialog { position: relative; }
  .dialog-close {
    position: absolute; top: 14px; right: 14px;
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text2); font-size: 16px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .dialog-close:hover { color: var(--error); border-color: var(--error); background: rgba(248,113,113,0.12); }

  /* ====== Download Section ====== */
  .dl-section { margin-top: 14px; text-align: left; }
  .dl-title { font-size: 13px; font-weight: 600; color: var(--info); margin: 12px 0 6px; }
  .dl-btn {
    display: block; text-align: center; padding: 10px;
    background: var(--surface2); color: var(--info);
    border-radius: 8px; text-decoration: none; font-size: 13px;
    font-weight: 600; border: 1px solid var(--border);
  }
  .dl-btn:hover { border-color: var(--info); }
  .dl-arch-row { display: flex; gap: 6px; }
  .dl-arch-btn {
    flex: 1; text-align: center; padding: 8px 4px;
    background: var(--bg); color: var(--text2);
    border-radius: 6px; text-decoration: none; font-size: 12px;
    font-weight: 600; border: 1px solid var(--border);
  }
  .dl-arch-btn:hover { border-color: var(--info); color: var(--info); }
  .dl-cmd {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; font-size: 11px;
    font-family: monospace; color: var(--text2); margin: 8px 0;
    word-break: break-all;
  }
  .dl-copy { float: right; font-size: 11px; color: var(--info); cursor: pointer; margin-left: 8px; }
  .dl-copy:hover { text-decoration: underline; }
  .dl-toggle {
    display: block; font-size: 12px; color: var(--info);
    cursor: pointer; text-decoration: underline; margin-top: 6px;
  }
  .dl-help {
    margin-top: 8px; font-size: 12px; color: var(--text2);
    line-height: 1.7; background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; display: none;
  }
  .dl-help code { background: rgba(0,0,0,0.3); padding: 1px 5px; border-radius: 3px; font-size: 11px; }
  .dl-help table { width: 100%; border-collapse: collapse; margin: 6px 0; font-size: 11px; }
  .dl-help th, .dl-help td { border: 1px solid var(--border); padding: 4px 6px; text-align: left; }
  .dl-help th { background: var(--surface2); color: var(--info); }
  /* Linux guide: step cards (2-column on wide dialog) */
  .dl-guide { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .dl-guide-head { font-size: 13px; font-weight: 700; color: var(--info); margin-bottom: 2px; grid-column: 1 / -1; }
  .dl-step {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px;
  }
  .dl-step.wide { grid-column: 1 / -1; }
  .dl-guide-foot { grid-column: 1 / -1; }
  .dl-step-title { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .dl-step-title .num {
    display: inline-block; min-width: 18px; height: 18px; line-height: 18px;
    text-align: center; background: var(--accent); color: #fff;
    border-radius: 50%; font-size: 11px; font-weight: 700; margin-right: 6px;
  }
  .dl-cmd-block {
    display: block; background: rgba(0,0,0,0.45); color: var(--info);
    padding: 8px 10px; border-radius: 6px; font-family: monospace;
    font-size: 11px; white-space: pre-wrap; word-break: break-all; line-height: 1.5;
    margin: 4px 0;
  }
  .dl-step-note { font-size: 11px; color: var(--text2); margin-top: 6px; }
  .dl-guide-foot { font-size: 11px; color: var(--text2); border-top: 1px dashed var(--border); padding-top: 8px; margin-top: 2px; line-height: 1.7; }
  #connect-dialog { max-height: 92vh; overflow-y: auto; }

  /* ====== Responsive: mobile / narrow screens ====== */
  @media (max-width: 720px) {
    #header { flex-wrap: wrap; gap: 6px 10px; padding: 10px 14px; }
    #header .title { font-size: 14px; }
    #messages { padding: 14px 12px; }
    #input-area { padding: 10px 12px; }
    .msg { max-width: 94%; }
    .msg.ai { max-width: 100%; }
    #connect-dialog { padding: 20px 16px; width: 100%; max-width: 96vw; }
    #approval-dialog { padding: 18px 16px; width: 100%; max-width: 96vw; }
    .dl-guide { grid-template-columns: 1fr; }
    .dl-step.wide { grid-column: auto; }
    .dl-arch-row { flex-wrap: wrap; }
    .dl-arch-btn { flex: 1 1 45%; }
    .tool-header { flex-wrap: wrap; }
    .tool-header .args { width: 100%; order: 3; }
    .tool-body pre { max-height: 220px; }
    #room-display { font-size: 12px; letter-spacing: 1px; padding: 3px 8px; }
  }

  /* ====== Client download panel (collapsible) ====== */
  .client-panel { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 12px; }
  .client-toggle {
    display: block; text-align: center; font-size: 12px; color: var(--info);
    cursor: pointer; padding: 8px; border-radius: 8px;
    border: 1px dashed var(--border); background: rgba(15,52,96,0.3);
  }
  .client-toggle:hover { border-color: var(--info); }
  .client-body { display: none; margin-top: 12px; text-align: left; }
  .dl-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .dl-tab {
    flex: 1; padding: 8px; text-align: center; font-size: 13px; font-weight: 600;
    background: var(--bg); color: var(--text2); border: 1px solid var(--border);
    border-radius: 8px; cursor: pointer;
  }
  .dl-tab.active { background: var(--surface2); color: var(--info); border-color: var(--info); }
  .dl-tab-panel { display: none; }
  .dl-tab-panel.active { display: block; }
  .dl-note { font-size: 11px; color: var(--text2); line-height: 1.6; margin-top: 8px; }

  /* ====== Scrollbar ====== */
  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div id="app">
  <div id="header">
    <div>
      <span id="status-dot" class="connecting"></span>
      <span class="title" data-i18n="app_title">云端 AI 远程运维助手</span>
      <span id="status-text" data-i18n="status_connecting">正在连接...</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <button id="auto-approve-btn" title="Tier 2 自动审批：开启后鼠标/键盘等交互操作无需弹窗确认" onclick="toggleAutoApprove()">T2 Auto OFF</button>
      <select id="lang-switcher">
        <option value="zh-CN">简</option>
        <option value="zh-TW">繁</option>
        <option value="en">EN</option>
      </select>
      <button id="export-btn" style="padding:4px 10px;font-size:12px;background:var(--surface2);color:var(--text2);border:1px solid var(--border);border-radius:4px;cursor:pointer;display:none;" data-i18n="export_btn">导出对话</button>
      <button id="reconnect-btn" style="padding:4px 10px;font-size:12px;background:var(--surface2);color:var(--info);border:1px solid var(--info);border-radius:4px;cursor:pointer;display:none;" data-i18n="reconnect_btn">重新连接</button>
      <div id="room-display"></div>
    </div>
  </div>

  <div id="messages"></div>

  <div id="input-area">
    <textarea id="input-box" data-i18n-placeholder="input_placeholder" placeholder="描述你的电脑问题，例如：帮我检查系统有没有异常" rows="1"></textarea>
    <button id="send-btn" disabled data-i18n="send_btn">发送</button>
  </div>
</div>

<!-- Connect Dialog -->
<div id="connect-overlay">
  <div id="connect-dialog">
    <button class="dialog-close" id="close-connect-btn" title="关闭" aria-label="关闭">✕</button>
    <h2 data-i18n="dialog_title">[+] 加入远程诊断</h2>
    <p data-i18n="dialog_subtitle">输入 6 位房间码，或创建一个新房间</p>
    <input id="room-input" type="text" maxlength="6" placeholder="AB12CD" autocomplete="off">
    <div class="action-row">
      <button id="join-btn" data-i18n="dialog_join">加入房间</button>
      <button id="create-room-link" data-i18n="dialog_create">创建新房间</button>
    </div>

    <div class="client-panel">
      <span class="client-toggle" onclick="toggleClientPanel()" data-i18n="client_toggle">[+] 首次使用？下载桥接器客户端</span>
      <div class="client-body" id="client-body">
        <div class="dl-tabs">
          <div class="dl-tab active" data-tab="win" onclick="switchDlTab('win')">Windows</div>
          <div class="dl-tab" data-tab="linux" onclick="switchDlTab('linux')">Linux</div>
        </div>

        <!-- Windows panel -->
        <div class="dl-tab-panel active" id="dl-panel-win">
          <a href="/static/bridge-win64.exe" download class="dl-btn" data-i18n="dialog_download">
            [v] 下载 Windows 桥接器 (bridge-win64.exe, 4.8MB)
          </a>
          <div class="dl-note" data-i18n-html="dl_win_note"></div>
        </div>

        <!-- Linux panel -->
        <div class="dl-tab-panel" id="dl-panel-linux">
          <div class="dl-arch-row">
            <a href="/static/bridge-linux-amd64" download class="dl-arch-btn" title="x86_64 / Ubuntu / UOS / KOS / RedHat">x86_64</a>
            <a href="/static/bridge-linux-arm64" download class="dl-arch-btn" title="ARM64 / 飞腾 / 鲲鹏">ARM64</a>
            <a href="/static/bridge-linux-loong64" download class="dl-arch-btn" title="LoongArch / 龙芯">龙芯</a>
          </div>
          <div class="dl-cmd">
            <span class="dl-copy" onclick="copyLinuxCmd(this)" data-i18n="dl_copy">复制</span>
            <span id="linux-cmd-text">curl -sL http://106.54.193.9:8000/static/install-linux.sh | bash</span>
          </div>
          <a class="dl-toggle" onclick="toggleLinuxHelp()" data-i18n="dl_linux_toggle">[+] Linux 安装教程</a>
          <div class="dl-help" id="linux-help" data-i18n-html="dl_linux_help"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Approval Dialog -->
<div id="approval-overlay">
  <div id="approval-dialog">
    <h3 id="approval-title" data-i18n="approval_title">审批请求 — 工具调用需要你的授权</h3>
    <p id="approval-desc" style="font-size:13px;color:var(--text2);" data-i18n="approval_desc">AI 想要执行以下 Tier <span id="approval-tier"></span> 操作：</p>
    <div class="tool-info">
      <strong id="approval-tool" style="color:var(--info);"></strong>
      <div class="args-display" id="approval-args" style="margin-top: 8px;"></div>
    </div>
    <p class="timer" id="approval-timer"></p>
    <div class="btn-row">
      <button class="btn-deny" onclick="respondApproval(false)" data-i18n="approval_deny">拒绝</button>
      <button class="btn-approve" onclick="respondApproval(true)" data-i18n="approval_approve">同意执行</button>
    </div>
    <textarea class="deny-reason" id="deny-reason" data-i18n-placeholder="approval_reason_placeholder" placeholder="拒绝理由（可选）"></textarea>
  </div>
</div>

<script>
// ============================================================
// Debug: version marker + error reporting
// ============================================================
const UI_VERSION = '2026-08-02-fix2';
console.log('[UI] version:', UI_VERSION, 'approval-title exists:', !!document.getElementById('approval-title'));
try {
  fetch('/api/debug_log', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ msg: 'UI LOADED', version: UI_VERSION, approval_title: !!document.getElementById('approval-title'), approval_desc: !!document.getElementById('approval-desc'), url: location.href })
  }).catch(function(){});
} catch (e) {}
window.onerror = function(msg, src, line, col, err) {
  try {
    console.error('[UI ERROR]', msg, src, line, col, err);
    fetch('/api/debug_log', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ msg: String(msg), src: src, line: line, col: col, stack: err ? String(err.stack).slice(0, 500) : '', version: UI_VERSION })
    }).catch(function(){});
  } catch (e) {}
  return false;
};

  currentLang = lang; localStorage.setItem('bridge_ui_lang', lang);
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    if (el.id === 'approval-desc') return; // 保留内部 span#approval-tier，弹窗显示时动态重建
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
  document.getElementById('lang-switcher').value = lang;
  document.title = t('app_title');
  if (roomCode) document.getElementById('room-display').textContent = t('room_prefix') + roomCode;
}

function toggleClientPanel() {
  const body = document.getElementById('client-body');
  const toggle = document.querySelector('.client-toggle');
  if (!body) return;
  if (body.style.display === 'block') {
    body.style.display = 'none';
    toggle.textContent = t('client_toggle');
  } else {
    body.style.display = 'block';
    toggle.textContent = '[-] ' + (currentLang === 'en' ? 'First time? Download the bridge client' : (currentLang === 'zh-TW' ? '首次使用？下載橋接器客戶端' : '首次使用？下载桥接器客户端'));
  }
}

function switchDlTab(tab) {
  document.querySelectorAll('.dl-tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
  document.getElementById('dl-panel-win').classList.toggle('active', tab === 'win');
  document.getElementById('dl-panel-linux').classList.toggle('active', tab === 'linux');
}

function toggleLinuxHelp() {
  const help = document.getElementById('linux-help');
  const toggle = document.querySelector('.dl-toggle');
  if (!help) return;
  if (help.style.display === 'block') {
    help.style.display = 'none';
    toggle.textContent = t('dl_linux_toggle');
  } else {
    help.style.display = 'block';
    toggle.textContent = '[-] ' + (currentLang === 'en' ? 'Linux Install Guide' : (currentLang === 'zh-TW' ? 'Linux 安裝教學' : 'Linux 安装教程'));
  }
}

function copyLinuxCmd(el) {
  const txt = document.getElementById('linux-cmd-text');
  if (!txt) return;
  const text = txt.textContent.trim();
  const done = () => { el.textContent = t('dl_copy') + ' ✓'; setTimeout(() => { el.textContent = t('dl_copy'); }, 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  document.body.removeChild(ta);
}

// ============================================================
// Connection
// ============================================================
function setStatus(state) {
  statusDot.className = state;
  if (state === 'online') {
    statusText.textContent = bridgeConnected ? t('status_bridge_ok') : t('status_waiting_bridge');
    if (!bridgeConnected) statusDot.className = 'connecting';
  } else if (state === 'offline') {
    statusText.textContent = t('status_disconnected');
  } else if (state === 'connecting') {
    statusText.textContent = t('status_connecting');
  }
}

function updateBridgeStatus(connected) {
  bridgeConnected = connected;
  setStatus(connected ? 'online' : ws ? 'online' : 'offline');
  statusDot.className = connected ? 'online' : 'connecting';
  statusText.textContent = connected ? t('status_bridge_ok') : t('status_bridge_wait');
  sendBtn.disabled = !connected;
  autoApproveBtn.style.display = connected ? 'inline-block' : 'none';
  updateAutoApproveBtnState();
}

function updateAutoApproveBtnState() {
  if (autoApproveT2) {
    autoApproveBtn.className = 'enabled';
    autoApproveBtn.textContent = t('auto_approve_enabled');
  } else {
    autoApproveBtn.className = '';
    autoApproveBtn.textContent = t('auto_approve_disabled');
  }
}

function toggleAutoApprove() {
  autoApproveT2 = !autoApproveT2;
  localStorage.setItem('auto_approve_t2', autoApproveT2);
  updateAutoApproveBtnState();
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'auto_approve_toggle', enabled: autoApproveT2 }));
  }
}

function connect(room) {
  roomCode = room;
  roomDisplay.textContent = t('room_prefix') + room;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = proto + '//' + location.host + '/ws/browser/' + room;
  setStatus('connecting');
  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    reconnectAttempts = 0;
    overlay.style.display = 'none';
    document.getElementById('reconnect-btn').style.display = 'none';
    exportBtn.style.display = 'inline-block';
    addSystemMsg(t('msg_connected'));
    // Sync auto-approve state with server
    ws.send(JSON.stringify({ type: 'auto_approve_toggle', enabled: autoApproveT2 }));
  };

  ws.onmessage = (event) => {
    let msg;
    try {
      msg = JSON.parse(event.data);
    } catch (e) {
      console.error('Bad WS message:', event.data);
      return;
    }
    handleMessage(msg);
  };

  ws.onclose = () => {
    setStatus('offline'); sendBtn.disabled = true;
    addSystemMsg(t('status_connection_lost'));
    scheduleReconnect();
  };

  ws.onerror = () => { addErrorMsg(t('msg_ws_failed')); };
}

// 自动重连：指数退避，最多 5 次
function scheduleReconnect() {
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  if (reconnectAttempts >= 5 || !roomCode || !ws || ws.readyState !== WebSocket.CLOSED) return;
  const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 15000);
  reconnectAttempts++;
  addSystemMsg('[' + reconnectAttempts + '/5] ' + (currentLang === 'en' ? 'Auto-reconnecting in ' : '自动重连中，') + (delay / 1000) + 's');
  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    if (!roomCode) return;
    addSystemMsg(t('status_connecting'));
    connect(roomCode);
  }, delay);
}

// ============================================================
// Message handler
// ============================================================
function handleMessage(msg) {
  switch (msg.type) {
    case 'status':
      if (msg.bridge_connected !== undefined) updateBridgeStatus(msg.bridge_connected);
      addSystemMsg(msg.content);
      break;
    case 'tool_start':
      addToolCard(msg.tool, msg.args, msg.tier);
      break;
    case 'tool_result':
      updateToolResult(msg.tool, msg.content, msg.denied);
      break;
    case 'approval_required':
      showApprovalDialog(msg);
      break;
    case 'ai_message':
      addAiMessage(msg.content);
      break;
    case 'ai_done':
      sendBtn.disabled = false; inputBox.focus();
      break;
    case 'error':
      addErrorMsg(msg.content); sendBtn.disabled = false;
      break;
    case 'pong': break;
    default:
      console.log('Unknown message type:', msg.type, msg);
  }
}

// ============================================================
// Approval dialog
// ============================================================
function showApprovalDialog(msg) {
  pendingApprovalId = msg.id;
  approvalDeadline = Date.now() + (msg.timeout || 300) * 1000;

  document.getElementById('approval-tool').textContent = msg.tool;

  // 确保 span#approval-tier 存在（applyLang 或 innerHTML 重建可能删除它）
  let tierEl = document.getElementById('approval-tier');
  if (!tierEl) {
    const descEl = document.getElementById('approval-desc');
    descEl.innerHTML = t('approval_desc') + '<span id="approval-tier"></span> ' + t('tool_tier' + (msg.tier || 2)) + ':';
    tierEl = document.getElementById('approval-tier');
  }
  tierEl.textContent = 'T' + (msg.tier || 2);
  tierEl.style.color = msg.tier === 3 ? 'var(--error)' : 'var(--warn)';

  const argsEl = document.getElementById('approval-args');
  argsEl.textContent = JSON.stringify(msg.args || {}, null, 2);

  document.getElementById('deny-reason').style.display = 'none';
  document.getElementById('deny-reason').value = '';

  approvalOverlay.style.display = 'flex';
  document.getElementById('approval-title').textContent = t('approval_title');
  const descEl2 = document.getElementById('approval-desc');
  descEl2.innerHTML = (t('approval_desc') + '<span id="approval-tier" style="color:' + (msg.tier === 3 ? 'var(--error)' : 'var(--warn)') + ';font-weight:700;">T' + (msg.tier || 2) + '</span> ' + t('tool_tier' + (msg.tier || 2)) + ':');

  // Flash the page title to get user attention
  let originalTitle = document.title;
  let count = 0;
  const flashInterval = setInterval(function() {
    document.title = (count % 2 === 0) ? '[!!!] ' + t('approval_title') : originalTitle;
    count++;
    if (count > 20 || pendingApprovalId === null) {
      clearInterval(flashInterval);
      document.title = originalTitle;
    }
  }, 500);

  // Store for cleanup
  approvalOverlay._flashInterval = flashInterval;
  approvalOverlay._originalTitle = originalTitle;

  updateApprovalTimer();
  approvalTimerInterval = setInterval(updateApprovalTimer, 1000);

  // Show deny reason when hovering over deny button
  const denyBtn = document.querySelector('.btn-deny');
  denyBtn.onmouseenter = () => { document.getElementById('deny-reason').style.display = 'block'; };
}

function updateApprovalTimer() {
  const remaining = Math.max(0, Math.round((approvalDeadline - Date.now()) / 1000));
  const timer = document.getElementById('approval-timer');
  const mins = Math.floor(remaining / 60);
  const secs = remaining % 60;
  timer.textContent = (currentLang === 'zh-CN' ? '剩余时间: ' :
                       currentLang === 'zh-TW' ? '剩餘時間: ' : 'Time remaining: ')
                     + mins + ':' + (secs < 10 ? '0' : '') + secs;

  if (remaining <= 10) timer.style.color = 'var(--error)';
  if (remaining <= 0) {
    clearInterval(approvalTimerInterval);
    const id = pendingApprovalId;
    approvalOverlay.style.display = 'none';
    pendingApprovalId = null;
    // Auto-deny on timeout
    if (ws && ws.readyState === WebSocket.OPEN && id) {
      ws.send(JSON.stringify({ type: 'approval_response', id: id, approved: false, reason: 'approval_timeout' }));
    }
  }
}

function respondApproval(approved) {
  clearInterval(approvalTimerInterval);
  // Stop the title flash
  if (approvalOverlay._flashInterval) {
    clearInterval(approvalOverlay._flashInterval);
    document.title = approvalOverlay._originalTitle || document.title;
  }
  let reason = '';
  if (!approved) {
    reason = document.getElementById('deny-reason').value.trim();
  }
  const id = pendingApprovalId;
  approvalOverlay.style.display = 'none';
  pendingApprovalId = null;
  if (ws && ws.readyState === WebSocket.OPEN && id) {
    ws.send(JSON.stringify({
      type: 'approval_response',
      id: id,
      approved: approved,
      reason: reason,
    }));
  } else {
    console.log('Cannot send approval: ws=' + (ws ? ws.readyState : 'null') + ' id=' + id);
  }
}

// Deny reason input enter key
document.getElementById('deny-reason').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && e.shiftKey) {
    e.preventDefault();
    respondApproval(false);
  }
});

// ============================================================
// Message rendering
// ============================================================
function addSystemMsg(text) {
  const el = document.createElement('div'); el.className = 'msg system';
  el.textContent = text; messagesEl.appendChild(el); scrollBottom();
}

function addErrorMsg(text) {
  const el = document.createElement('div'); el.className = 'msg error';
  el.textContent = '[!] ' + text; messagesEl.appendChild(el); scrollBottom();
}

function fmtMsgTime() {
  const d = new Date();
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function addAiMessage(content) {
  const el = document.createElement('div'); el.className = 'msg ai';
  const time = document.createElement('span'); time.className = 'msg-time'; time.textContent = fmtMsgTime();
  const body = document.createElement('div'); body.className = 'msg-body';
  body.innerHTML = renderMarkdown(content);
  el.appendChild(time); el.appendChild(body);
  messagesEl.appendChild(el); scrollBottom();
}

function addUserMessage(text) {
  const el = document.createElement('div'); el.className = 'msg user';
  const body = document.createElement('div'); body.className = 'msg-body'; body.textContent = text;
  const time = document.createElement('span'); time.className = 'msg-time'; time.textContent = fmtMsgTime();
  el.appendChild(body); el.appendChild(time);
  messagesEl.appendChild(el); scrollBottom();
}

function renderMarkdown(md) {
  let html = md.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // 保护代码块：占位符避免内部被后续 markdown 规则污染
  const codeBlocks = [];
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(m, lang, code) {
    codeBlocks.push('<pre><code>' + code + '</code></pre>');
    return '%%CODEBLOCK' + (codeBlocks.length - 1) + '%%';
  });
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // 无序列表：连续 - 行 → <ul><li>...</li></ul>
  html = html.replace(/(?:^[-*] .+(?:\n|$))+/gm, function(m) {
    const items = m.trim().split('\n')
      .map(l => '<li>' + l.replace(/^[-*]\s+/, '') + '</li>').join('');
    return '<ul>' + items + '</ul>';
  });
  // 有序列表：连续数字行 → <ol><li>...</li></ol>
  html = html.replace(/(?:^\d+\. .+(?:\n|$))+/gm, function(m) {
    const items = m.trim().split('\n')
      .map(l => '<li>' + l.replace(/^\d+\.\s+/, '') + '</li>').join('');
    return '<ol>' + items + '</ol>';
  });
  html = html.replace(/\n\n/g, '<br><br>'); html = html.replace(/\n/g, '<br>');
  // 还原代码块（内部换行保持原样）
  html = html.replace(/%%CODEBLOCK(\d+)%%/g, function(m, i) { return codeBlocks[+i]; });
  return html;
}

const TIER3 = ['Shell','App','PlaySound','FileWrite','FileUpload','KillProcess','RegWrite','ServiceStart','ServiceStop','TaskCreate','TaskDelete','SetClipboard','LockScreen'];
const TIER2 = ['Click','Type','Move','Scroll','Shortcut','FocusWindow','MinimizeAll','Scrape','CancelTask','ReconnectSession'];

function getTierBadge(toolName, tier) {
  let tierLevel = tier || 1;
  if (!tier) {
    if (TIER3.includes(toolName)) tierLevel = 3;
    else if (TIER2.includes(toolName)) tierLevel = 2;
  }
  if (tierLevel === 3) return '<span class="tier-badge t3" title="' + t('tool_tier3') + '">T3</span>';
  if (tierLevel === 2) return '<span class="tier-badge t2" title="' + t('tool_tier2') + '">T2</span>';
  return '';
}

function addToolCard(toolName, args, tier) {
  const el = document.createElement('div');
  el.className = 'msg tool'; el.dataset.tool = toolName;
  const argsText = args && Object.keys(args).length > 0 ? JSON.stringify(args) : '';
  const badge = getTierBadge(toolName, tier);
  el.innerHTML = '<div class="tool-header" onclick="this.parentElement.querySelector(\'.tool-body\').classList.toggle(\'open\')">'
    + '<span class="icon">[*]</span>' + badge
    + '<span class="name">' + escapeHtml(toolName) + '</span>'
    + '<span class="args" style="font-size:11px;color:var(--text2)">' + escapeHtml(argsText) + '</span>'
    + '<span class="status tool-status running">' + escapeHtml(t('tool_running')) + '</span>'
    + '</div><div class="tool-body"><pre>' + escapeHtml(t('tool_waiting')) + '</pre></div>';
  messagesEl.appendChild(el); scrollBottom();
}

function updateToolResult(toolName, content, denied) {
  const cards = messagesEl.querySelectorAll('.msg.tool');
  let card = null;
  for (let i = cards.length - 1; i >= 0; i--) {
    if (cards[i].dataset.tool === toolName) { card = cards[i]; break; }
  }
  if (!card) return;
  const statusEl = card.querySelector('.tool-status');
  const body = card.querySelector('.tool-body');
  const pre = body.querySelector('pre');
  pre.textContent = content;

  if (denied || content.includes('[approval_denied]')) {
    statusEl.textContent = t('tool_denied');
    statusEl.className = 'status tool-status denied';
  } else {
    const isErr = content.includes('[error]') || content.includes('[timeout]')
      || content.includes('[exception]') || content.includes('[stderr]');
    if (isErr) {
      statusEl.textContent = t('tool_error');
      statusEl.className = 'status tool-status error';
    } else {
      statusEl.textContent = t('tool_done');
      statusEl.className = 'status tool-status done';
    }
  }
}

function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ============================================================
// User actions
// ============================================================
function sendMessage() {
  const text = inputBox.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN || !bridgeConnected) return;
  addUserMessage(text);
  ws.send(JSON.stringify({ type: 'chat', content: text }));
  inputBox.value = ''; inputBox.style.height = 'auto'; sendBtn.disabled = true;
}

sendBtn.addEventListener('click', sendMessage);
inputBox.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
inputBox.addEventListener('input', () => {
  inputBox.style.height = 'auto';
  inputBox.style.height = Math.min(inputBox.scrollHeight, 120) + 'px';
});

joinBtn.addEventListener('click', () => {
  let code = roomInput.value.trim().toUpperCase();
  if (code.length === 6) { connect(code); }
  else { alert(t('alert_room_code')); }
});
roomInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinBtn.click(); });
createRoomLink.addEventListener('click', async () => {
  try {
    const resp = await fetch('/api/rooms', { method: 'POST' });
    const data = await resp.json();
    roomInput.value = data.room_code; connect(data.room_code);
  } catch (err) { alert(t('alert_create_fail') + err.message); }
});

langSwitcher.addEventListener('change', () => { applyLang(langSwitcher.value); });

// Close / reopen connect dialog
document.getElementById('close-connect-btn').addEventListener('click', () => {
  overlay.style.display = 'none';
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    document.getElementById('reconnect-btn').style.display = 'inline-block';
  }
});
document.getElementById('reconnect-btn').addEventListener('click', () => {
  document.getElementById('reconnect-btn').style.display = 'none';
  overlay.style.display = 'flex';
  roomInput.focus();
});

// ============================================================
// Export
// ============================================================
exportBtn.addEventListener('click', () => {
  const lines = [];
  const now = new Date().toLocaleString(currentLang === 'en' ? 'en-US' : 'zh-CN');
  lines.push(t('export_title')); lines.push(t('export_time') + ': ' + now);
  lines.push(t('export_room') + ': ' + roomCode);
  lines.push(t('export_bridge') + ': ' + (bridgeConnected ? t('export_connected') : t('export_disconnected')));
  lines.push('='.repeat(50)); lines.push('');
  const children = messagesEl.children;
  for (const el of children) {
    if (el.classList.contains('user')) { lines.push('[' + t('export_user') + '] ' + el.textContent.trim()); }
    else if (el.classList.contains('ai')) { lines.push('[' + t('export_ai') + ']'); lines.push(el.textContent.trim()); lines.push(''); }
    else if (el.classList.contains('tool')) {
      const name = el.querySelector('.name')?.textContent || '';
      const status = el.querySelector('.tool-status')?.textContent || '';
      const body = el.querySelector('pre')?.textContent || '';
      lines.push('--- ' + t('export_tool') + ': ' + name + ' (' + status + ') ---');
      lines.push(body.trim()); lines.push('---'); lines.push('');
    } else if (el.classList.contains('error')) { lines.push('[' + t('export_error') + '] ' + el.textContent.trim()); }
    else if (el.classList.contains('system')) { lines.push('[' + t('export_system') + '] ' + el.textContent.trim()); }
  }
  const text = lines.join('\n');
  const blob = new Blob([text], { type:'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'diagnostic_report_' + roomCode + '_' + new Date().toISOString().slice(0,10) + '.txt';
  a.click(); URL.revokeObjectURL(url);
});

// ============================================================
// Init
// ============================================================
langSwitcher.value = currentLang;
applyLang(currentLang);
updateAutoApproveBtnState();
overlay.style.display = 'flex';
roomInput.focus();
</script>
